[workspace]
resolver = "3"
members = [
  "_sdk-rust",
  "candlesticks",
  "chart",
  "dag",
  "market-table",
  "news-list",
  "security-snapshot",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1.3"
ratatui = "0.30"
ratatui-core = "0.1"
ratatui-widgets = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
